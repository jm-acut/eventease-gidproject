<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f8ff" />
  <title>Event Ease</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="sheetRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Debug: shows any JavaScript error on the page. Remove once the app works. -->
  <script>
    window.addEventListener('error', function (e) {
      var box = document.getElementById('app');
      box.style.padding = '20px';
      box.style.color = '#b00020';
      box.style.fontSize = '13px';
      box.style.whiteSpace = 'pre-wrap';
      box.textContent = 'JS error: ' + e.message + '\nFile: ' + (e.filename || '').split('/').pop() + '  Line: ' + e.lineno;
    });
  </script>

  <script src="js/app.js"></script>
</body>
</html>
